apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-eval-3d-visualizer
  namespace: autonomy-tooling
  labels:
    app: eval-visualizer
    tier: frontend-telemetry
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eval-visualizer
  template:
    metadata:
      labels:
        app: eval-visualizer
    spec:
      containers:
      - name: visualizer-server
        image: ghcr.io/authrain-cloud-abdullahformuli/ai-eval-3d-visualizer:v1.0.0
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: WS_TELEMETRY_PORT
          value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-eval-3d-visualizer-svc
  namespace: autonomy-tooling
spec:
  type: ClusterIP
  selector:
    app: eval-visualizer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
